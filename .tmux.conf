# Change Prefix from C-b to C-a
#unbind C-b
#set -g prefix C-a

# bind C-a Ca to 'home', or start of line, which was C-a previously
#bind C-a send-prefix

# Reload ~/.tmux.conf
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# fix vim escape delay in tmux. Default 500 milliseconds. 10 or 50 is much better.
set -sg escape-time 10

# change the current pane background
set -g window-active-style bg=gray

# allow Copy-Paste using xclip
bind C-c run "tmux save-buffer - | xclip -i -sel clip" 
bind C-v run "tmux set-buffer $(xclip -o -sel clip); tmux paste-buffer"

# 256 colors
set -g default-terminal "screen-256color"

# allow utf8 support
setw -gq utf8 on

# Splitting panes
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Open new panes in current path
bind c new-window -c  '#{pane_current_path}'

# use Alt-arrow keys WITHOUT PREFIX KEY to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# increase history
set-option -g history-limit 5000

# allow mouse usage
set -g mouse on

# more intuitive Split command. (Not my default as I want to keep the default muscle memory for systems that don't have my customizations)
# Prefix + |, tmux does a vertical split, and when I press Prefix + -, tmux does a horizontal split.
#bind | split-window -hc "#{pane_current_path}"
#bind - split-window -vc "#{pane_current_path}"

# toggle Windows and Sessions. Default for Space is to toggle tmux layout which I personally never use.
bind Space last-window
